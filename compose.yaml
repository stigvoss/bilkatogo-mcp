services:
  bilkatogo-mcp:
    # Public image, published by CI on every push to main.
    image: ghcr.io/stigvoss/bilkatogo-mcp:latest
    restart: unless-stopped
    # Run as the owner of secrets/* so they can stay chmod 600 (set PUID/PGID in .env).
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      # Public hostname the reverse proxy serves this under (Host-header allow-list).
      BILKATOGO_ALLOWED_HOSTS: "bilka-mcp.example.com"
      BILKATOGO_STORE_ID: "1666"
      # BILKATOGO_MAX_QUANTITY: "20"
      # Trust X-Forwarded-* only from the proxy: set to the proxy container's IP or subnet.
      # FORWARDED_ALLOW_IPS: "172.20.0.0/16"
      MCP_API_KEY_FILE: /run/secrets/mcp_api_key
      # Bilka login: provide the pasted token, or email + password (or both). Each is optional,
      # but at least one is needed the first time. Once the server has logged in it remembers
      # the token in the data volume, so you can remove them afterwards.
      BILKATOGO_LOGIN_TOKEN_FILE: /run/secrets/bilkatogo_login_token
      # BILKATOGO_EMAIL_FILE: /run/secrets/bilkatogo_email
      # BILKATOGO_PASSWORD_FILE: /run/secrets/bilkatogo_password
    secrets:
      - mcp_api_key
      - bilkatogo_login_token
      # - bilkatogo_email
      # - bilkatogo_password
    volumes:
      - bilkatogo-data:/data
    networks:
      - proxy
    # No ports: the reverse proxy or tunnel reaches the container at http://bilkatogo-mcp:8000 over
    # the shared network. Prefer a network shared only with the proxy: every container on it can
    # reach this server.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  bilkatogo-data:

secrets:
  mcp_api_key:
    file: ./secrets/mcp_api_key
  bilkatogo_login_token:
    file: ./secrets/bilkatogo_login_token
  # bilkatogo_email:
  #   file: ./secrets/bilkatogo_email
  # bilkatogo_password:
  #   file: ./secrets/bilkatogo_password

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}   # the Docker network your reverse proxy or tunnel is on
