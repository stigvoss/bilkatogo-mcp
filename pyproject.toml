[project]
name = "bilkatogo-mcp"
version = "0.1.0"
description = "MCP server for BilkaToGo that impersonates the caller via their Gigya login_token"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "uvicorn>=0.30"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
